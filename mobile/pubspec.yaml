---
name: lokum_app
description: Official mobile application for Bar Lokum.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  http: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/campaign/
    - assets/data/
    - assets/icons/
    - assets/logos/
    - assets/qr/
    - assets/beer/
    - assets/beer/glarus/
    - assets/cocktails/
    - assets/events/
    - assets/events/brunch/
    - assets/events/quiz/
    - assets/events/themed/
    - assets/events/archive/DnD_VIT/
    - assets/events/archive/deestoned/
    - assets/events/archive/bgz/
    - assets/events/archive/ltnc/
    - assets/events/archive/MGW/
    - assets/events/archive/acoustic_adventures_part1/
    - assets/events/archive/acoustic_adventures_part2/
    - assets/events/archive/Y2K/
    - assets/events/archive/BG_Alternative_with_Simo/
    - assets/events/archive/blue_lamp_reunion/
    - assets/events/archive/teleport_to_90s/
    - assets/events/archive/children_of_the_korn/
    - assets/events/archive/maramalad/
    - assets/events/archive/vinyl_punk_rock_night/
    - assets/events/archive/end_of_year_2025/
    - assets/events/archive/luta_kuhnya/
    - assets/events/archive/dj_party_07082026/
    - assets/events/archive/ishtah/
    - assets/events/archive/sladkodumni_vecheri/
    - assets/events/archive/igralno_pole/
    - assets/events/archive/greesh_23082026/
    - assets/food/
    - assets/food/brunch/
    - assets/food/mains/
    - assets/food/burgers/
    - assets/food/salads/
    - assets/spirits/
    - assets/videos/
    - assets/wine/
  fonts:
    # Локални копия на Nunito/Unbounded (пълна кирилица) - НЕ през google_fonts
    # пакета, който тегли шрифтовете от мрежата при първо зареждане. Ако
    # телефонът е с слаб/никакъв сигнал при сканиране на QR кода, runtime
    # fetch-ът се проваля и цялото приложение пада на празен бял екран.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.woff2
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/Nunito-Bold.woff2
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.woff2
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/Unbounded-Bold.woff2
          weight: 700
