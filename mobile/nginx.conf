# Реалният клиентски IP при Tailscale Funnel трафик - ако Funnel/relay-ят
# подаде X-Forwarded-For, ползвай него в логовете, иначе (директен достъп,
# локална мрежа) пада обратно на $remote_addr.
map $http_x_forwarded_for $log_client_ip {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

log_format lokum_access '$log_client_ip - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log lokum_access;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # index.html/manifest/version.json - винаги revalidate, за да получат
    # клиентите новия build веднага след деплой (не чакат стар кеш да изтече).
    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    # Основният app bundle - сменя се при всеки деплой, но кешираме за 1 ден
    # с must-revalidate, за да не тегли клиентът наново при всяко посещение
    # в рамките на деня.
    location = /main.dart.js {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # CanvasKit/снимки/шрифтове/икони - сменят се рядко (нов Flutter SDK или
    # ново лого), безопасно е да се кешират дълго.
    location ~* \.(?:js|wasm|png|jpg|jpeg|webp|gif|ico|ttf|otf)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback - само за route-подобни пътища (без разширение, напр.
    # бъдещ /events/greesh-live). Липсващи статични файлове (.map, .txt,
    # снимки и т.н.) трябва да връщат истинска 404, а не index.html -
    # иначе браузър/SEO инструменти получават HTML там, където очакват
    # JSON/plain text (точно това чупеше source map fetch-а и robots.txt).
    location / {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        if ($uri ~ "\.") {
            return 404;
        }
        rewrite ^ /index.html last;
    }
}
