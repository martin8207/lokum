services:
  postgres:
    image: postgres:17

    container_name: lokum-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped
    # Без публичен ports mapping - базата е достъпна само вътре в Docker мрежата.
    # Ако ти трябва достъп освен за дебъг (напр. DBeaver), добави временно "5432:5432".

  lokum-server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: lokum-server

    environment:
      # Построена от същите POSTGRES_* стойности по-горе - винаги в синхрон,
      # без ръчно дублиране между .env файловете.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    env_file:
      - ./server/.env

    volumes:
      # Само за четене - позволява npm run seed да вижда винаги най-пресния
      # menu.json (регенериран от tools/excel_to_json.py) без rebuild на образа.
      - ./mobile/assets/data:/app/data:ro

    depends_on:
      - postgres

    restart: unless-stopped
    # Без "ports" тук - Caddy е единствената входна точка освен.
    # lokum-server е достъпен вътрешно през Docker DNS като "lokum-server:3000".

  lokum-web:
    build:
      context: ./mobile
      dockerfile: Dockerfile.web

    container_name: lokum-web

    ports:
      - "8080:80"
      # Публикуван на хоста самостоятелно (в допълнение на Caddy), за да може
      # Tailscale Funnel да сочи директно към nginx, без да минава през
      # host-based routing-а на Caddy (който в момента разпознава само
      # lokum-shumen.duckdns.org).

    volumes:
      - nginx_logs:/var/log/nginx
      # Достъп/натоварване логовете да оцеляват при rebuild - реалният
      # Funnel трафик минава директно през тази nginx, не през Caddy.

    restart: unless-stopped
    # Flutter web build - изходът се копира в /srv вътре в тази стъпка (виж Dockerfile.web)

  lokum-web-v2:
    build:
      # ../lokum-test е отделен git worktree, chek-нат на branch "test" (виж
      # docs/mobile/DEVELOPMENT_WORKFLOW.md за setup командите) - същия repo,
      # различен branch на диска, без нужда от втори пълен clone.
      context: ../lokum-test/mobile
      dockerfile: Dockerfile.web

    container_name: lokum-web-v2

    ports:
      - "8081:80"
      # Само на хоста, БЕЗ Funnel/Caddy - достъпен само от устройства в
      # tailnet-а (http://<tailscale-ip-на-сървъра>:8081), никога публично.

    depends_on:
      - lokum-server-v2

    restart: unless-stopped
    # v2.0 тестова среда - изтегля съдържание от production чрез
    # `git merge main` в test branch-а (виж DEVELOPMENT_WORKFLOW.md),
    # никога обратно.

  lokum-server-v2:
    build:
      # Същият git worktree трик като lokum-web-v2 по-горе - отделен build
      # context на branch "test", за да не се налага /project/lokum (production)
      # да сменя branch само за да вземе бекенд промени за v2.0 разработката.
      context: ../lokum-test/server
      dockerfile: Dockerfile

    container_name: lokum-server-v2

    environment:
      # Същата база като production lokum-server - безопасно, новите
      # test-only таблици (TableSession/Order/OrderItem) са невидими за
      # стария Prisma client на production, докато test не се merge-не.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Логин на бележника - споделена парола за целия персонал, не по
      # човек. И двете идват от root .env (git-ignored), никога хардкоднати
      # тук - виж server/src/routes/auth.js и middleware/requireStaffAuth.js.
      JWT_SECRET: ${JWT_SECRET}
      STAFF_PASSWORD_HASH: ${STAFF_PASSWORD_HASH}

    volumes:
      # Същият трик като production lokum-server - npm run seed трябва да
      # вижда menu.json. Пропуснат при първото добавяне на този service,
      # затова seed-ът гърмеше с "Не намирам menu.json". Сочи към test
      # worktree-а (../lokum-test), не към production-ния ./mobile.
      - ../lokum-test/mobile/assets/data:/app/data:ro

    depends_on:
      - postgres

    restart: unless-stopped
    # Без "ports" - достъпен само вътре в Docker мрежата, през nginx proxy-то
    # на lokum-web-v2 (виж mobile/nginx.conf), точно като production lokum-server.

  caddy:
    image: caddy:2-alpine
    container_name: lokum-caddy

    ports:
      - "80:80"
      # "443:443" временно спрян - Tailscale Funnel вече държи 443 на хоста
      # (нужен му е за собствения HTTPS listener). Docker не може да bind-не
      # 0.0.0.0:443 успоредно с вече заета конкретна IP на същия порт.
      # Ако искаме двата пътя (DuckDNS+Caddy HTTPS И Tailscale Funnel) да
      # работят едновременно, ще трябва Caddy да се bind-не към конкретен
      # интерфейс/IP вместо 0.0.0.0 - оставено за по-late, ако потрябва.

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - lokum-server
      - lokum-web

    restart: unless-stopped

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: lokum-duckdns

    env_file:
      - .env   # <-- токенът се чете оттук (DUCKDNS_TOKEN=...), НЕ се пише директно тук

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
      - SUBDOMAINS=lokum-shumen
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false

    restart: unless-stopped
    # Този контейнер само обновява DuckDNS с текущия публичен IP на лаптопа на всеки 5 мин.
    # Задължителен е, защото домашен/баращки интернет обикновено има динамичен IP.

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: fd00:dead:beef::/48

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  nginx_logs:
